<link rel="stylesheet" href="style.css">
<div class="overlay">
    <div class="inventory">

        <div class="ada-slot">
            <img class="ada"
                src="https://res.allmacwallpaper.com/get/Retina-MacBook-Air-13-inch-wallpapers/ada-wong-resident-evil-5k-2560x1600/24608-11.jpg">
            <div class="ada-name">ADA WONG</div>
        </div>

        <div class="main">

            <div class="header">
                <span class="indicator"></span>
                <span>DONATION RECEIVED</span>
                <span class="code">ITEM // 01</span>
            </div>

            <div class="donation">
                <div class="money">{amount}</div>
                <div class="donator">{donator}</div>
            </div>

            <div class="message">
                <span class="message-text">{message}</span>
                <span class="cursor"></span>
            </div>

            <div class="extra">
                <div class="wishlist">{wishlist}</div>
                <div class="product">{top_up_product_name}</div>
            </div>

        </div>

        <div class="media-slot">
            <div class="media-label">ITEM</div>
            <img class="media" src="{media}">
            <div class="slot-id">SLOT 01</div>
        </div>

        <div class="footer">
            <span>STATUS // RECEIVED</span>
            <span class="blocks">■ ■ ■ □</span>
            <span>01 / 01</span>
        </div>

        <div class="scanlines"></div>

    </div>
</div>
